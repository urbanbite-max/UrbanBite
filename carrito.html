<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu pedido | UrbanBite</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="carrito-page" data-roles="invitado,admin,cocina">

<header class="carrito-header">
    <button class="volver-btn" onclick="window.location.href='menu.html'">←</button>

    <div>
        <span>UrbanBite</span>
        <h1>Tu pedido</h1>
    </div>

    <button class="vaciar-btn" id="vaciarCarrito">Vaciar</button>
</header>

<main class="carrito-main">

    <section class="lista-carrito" id="listaCarrito"></section>

    <section class="carrito-vacio" id="carritoVacio">
        <div class="carrito-vacio-icon">🛒</div>
        <h2>Tu carrito está vacío</h2>
        <p>Agrega una hamburguesa, un perro o algo que te provoque.</p>
        <button onclick="window.location.href='menu.html'">Ver menú</button>
    </section>

    <section class="resumen-pedido" id="resumenPedido">
        <h2>Resumen</h2>

        <div class="resumen-linea">
            <span>Productos</span>
            <span id="cantidadResumen">0</span>
        </div>

        <div class="resumen-linea">
            <span>Subtotal</span>
            <strong>$<span id="subtotalCarrito">0</span></strong>
        </div>

        <div class="resumen-linea detalle-servicio">
            <span>Servicio</span>
            <span>$0</span>
        </div>

        <div class="separador"></div>

        <div class="resumen-total">
            <span>Total</span>
            <strong>$<span id="totalResumen">0</span></strong>
        </div>

        <button class="continuar-btn" id="continuarPedido">
            Continuar pedido <span>→</span>
        </button>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>
</body>
</html>
